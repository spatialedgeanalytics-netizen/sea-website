name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 6 */2 * *'   # every 2 days at 08:00 Harare time
  workflow_dispatch:         # adds a "Run workflow" button for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        env:
          RAW_URL: ${{ secrets.VITE_SUPABASE_URL }}
          RAW_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # remove stray quotes, spaces and line breaks
          URL=$(printf '%s' "$RAW_URL" | tr -d "\"' \r\n")
          KEY=$(printf '%s' "$RAW_KEY" | tr -d "\"' \r\n")
          URL="${URL%/}"

          if [ -z "$URL" ]; then
            echo "ERROR: secret VITE_SUPABASE_URL is missing or empty."; exit 1
          fi
          case "$URL" in
            https://*) ;;
            *) echo "ERROR: VITE_SUPABASE_URL must start with https://"; exit 1 ;;
          esac
          if [ -z "$KEY" ]; then
            echo "ERROR: secret VITE_SUPABASE_ANON_KEY is missing or empty."; exit 1
          fi

          curl --fail-with-body -sS "$URL/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY"
          echo ""
          echo "Supabase pinged successfully"