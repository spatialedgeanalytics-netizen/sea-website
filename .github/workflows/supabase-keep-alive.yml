name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 6 */2 * *'   # every 2 days at 08:00 Harare time
  workflow_dispatch:         # adds a "Run workflow" button for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          curl --fail -sS "${SUPABASE_URL%/}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}"
          echo ""
          echo "Supabase pinged successfully"